<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E81010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B30D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1E22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111214;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background pill/badge -->
  <rect x="0" y="8" width="92" height="84" rx="4" fill="url(#redGrad)"/>

  <!-- SOS text in badge -->
  <text x="46" y="62" 
    font-family="'Arial Black', 'Barlow Condensed', sans-serif" 
    font-weight="900" 
    font-size="38" 
    letter-spacing="-1"
    text-anchor="middle" 
    fill="white">SOS</text>

  <!-- Top notch line decoration -->
  <rect x="12" y="16" width="68" height="3" rx="1.5" fill="rgba(255,255,255,0.25)"/>

  <!-- Bottom tag -->
  <rect x="8" y="76" width="76" height="12" rx="2" fill="rgba(0,0,0,0.25)"/>
  <text x="46" y="86" 
    font-family="'Arial', sans-serif" 
    font-weight="700" 
    font-size="8" 
    letter-spacing="2"
    text-anchor="middle" 
    fill="rgba(255,255,255,0.85)">EMERGENCIAS</text>

  <!-- Main brand text -->
  <text x="106" y="48" 
    font-family="'Arial Black', 'Barlow Condensed', sans-serif" 
    font-weight="900" 
    font-size="36" 
    letter-spacing="1"
    fill="#FFFFFF">HOGAR</text>

  <!-- Red accent line -->
  <rect x="106" y="54" width="180" height="3" rx="1.5" fill="url(#redGrad)"/>

  <!-- 24/7 -->
  <text x="106" y="80" 
    font-family="'Arial Black', 'Barlow Condensed', sans-serif" 
    font-weight="900" 
    font-size="28" 
    letter-spacing="4"
    fill="#E81010">24/7</text>

  <!-- Dot separator -->
  <circle cx="196" cy="72" r="3" fill="#E81010"/>

  <!-- Tagline -->
  <text x="207" y="80" 
    font-family="'Arial', sans-serif" 
    font-weight="600" 
    font-size="11" 
    letter-spacing="2"
    fill="#9AA0AC">TÉCNICO CERTIFICADO</text>
</svg>
